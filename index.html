<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YAMATO FLEET 2199 — 宇宙戦艦ヤマト 艦隊戦デモ</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<style>
  /* Page shell only. The HUD (src/ui/hud.js) injects its own styles. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #dfe9f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #boot {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, #101a2c 0%, #05060a 70%);
    transition: opacity .6s ease; text-align: center;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  .boot-inner { max-width: 620px; padding: 2rem; }
  .boot-kicker { font-size: 11px; letter-spacing: .34em; color: #6f8bb0; margin-bottom: 1.1rem; }
  #boot h1 {
    margin: 0; font-size: clamp(34px, 7vw, 68px); font-weight: 800; letter-spacing: .1em;
    color: #eef4ff; text-shadow: 0 0 26px rgba(120,190,255,.45);
  }
  #boot h1 span { color: #7fc4ff; }
  .boot-sub { margin-top: .7rem; font-size: 13px; letter-spacing: .22em; color: #8fa6c2; }
  .boot-bar { margin: 1.9rem auto 0; width: min(340px, 70vw); height: 3px; background: #1a2536; overflow: hidden; }
  .boot-bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4a9ee8, #b6e6ff); transition: width .3s ease; }
  .boot-status { margin-top: .85rem; font-size: 12px; letter-spacing: .16em; color: #7d93ad; }
  .boot-err {
    margin-top: 1.3rem; padding: .85rem 1rem; text-align: left; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ffb4b4; background: rgba(120, 20, 20, .28); border: 1px solid rgba(255, 120, 120, .35);
    white-space: pre-wrap; max-height: 220px; overflow: auto;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD root: src/ui/hud.js builds its subtree inside this element -->
  <div id="hud" aria-live="polite"></div>

  <!-- Boot / loading screen: removed by src/main.js once the first frame renders -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-kicker">地球連邦宇宙海軍 / UNITED NATIONS COSMIC NAVY</div>
      <h1>YAMATO<span>FLEET</span>2199</h1>
      <div class="boot-sub">宇宙戦艦ヤマト 艦隊戦 — 技術デモ</div>
      <div class="boot-bar"><i id="boot-progress"></i></div>
      <div class="boot-status" id="boot-status">起動中… initialising</div>
      <div class="boot-err" id="boot-err" hidden></div>
    </div>
  </div>

  <noscript>
    <p style="color:#fff;font:14px system-ui;padding:2rem">This demo requires JavaScript and WebGL2.</p>
  </noscript>

  <script type="module">
    // Surface module-level failures on the boot screen instead of a blank page.
    const errEl = document.getElementById('boot-err');
    function fail(msg) {
      if (!errEl) return;
      errEl.hidden = false;
      errEl.textContent = String(msg);
      const st = document.getElementById('boot-status');
      if (st) st.textContent = '起動失敗 / BOOT FAILED';
    }
    window.addEventListener('error', (e) => fail(e.message || e.error));
    window.addEventListener('unhandledrejection', (e) => fail((e.reason && e.reason.stack) || e.reason));
    try {
      const mod = await import('./src/main.js');
      if (mod && typeof mod.boot === 'function') await mod.boot();
    } catch (err) {
      fail((err && err.stack) || err);
      console.error(err);
    }
  </script>
</body>
</html>
