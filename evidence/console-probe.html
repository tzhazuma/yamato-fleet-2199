<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!--
  The app resolves its asset URLs relative to the DOCUMENT (src/core/assets.js
  uses './assets/models/...'), so a page that lives in a subdirectory must
  declare the project root as its base or every OBJ fetch 404s and the demo
  silently degrades to placeholder blocks. This <base> makes the probe behave
  exactly like the real /index.html.
-->
<base href="../" />
<title>YAMATO FLEET 2199 — console probe (verifier)</title>
<!--
  evidence/console-probe.html — VERIFIER INSTRUMENT, not a product file.

  WHY THIS EXISTS
  index.html boots the demo from an inline <script type="module">, so there is
  no way to install console hooks before the app's own code runs. This page
  reproduces index.html's DOM shell byte-for-byte (same ids: #game, #hud,
  #boot, #boot-progress, #boot-status, #boot-err) and the same import map, then
  installs console.error/console.warn/console.log + window.onerror hooks
  BEFORE dynamically importing ../src/main.js and calling boot().

  It is served from the same origin (tools/serve.mjs serves the project root),
  so every module, asset fetch and code path is identical to the real page.
  Read window.__PROBE__ for the captured console traffic.

  Owned by the verifier (tests/**, evidence/**, docs/VERIFY.md).
-->
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/build/three.module.js",
    "three/addons/": "../vendor/three/examples/jsm/"
  }
}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #dfe9f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #101a2c 0%, #05060a 70%); transition: opacity .6s ease; text-align: center; }
  #boot.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" aria-live="polite"></div>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-kicker">地球連邦宇宙海軍 / UNITED NATIONS COSMIC NAVY</div>
      <h1>YAMATO<span>FLEET</span>2199</h1>
      <div class="boot-sub">宇宙戦艦ヤマト 艦隊戦 — 技術デモ</div>
      <div class="boot-bar"><i id="boot-progress"></i></div>
      <div class="boot-status" id="boot-status">起動中… initialising</div>
      <div class="boot-err" id="boot-err" hidden></div>
    </div>
  </div>

  <script>
    // ---- console capture, installed BEFORE any app module loads -------------
    window.__PROBE__ = {
      startedAt: new Date().toISOString(),
      errors: [], warnings: [], logs: [], info: [], debug: [],
      windowErrors: [], unhandledRejections: [],
      phase: 'hooks-installed',
    };
    const P = window.__PROBE__;
    const fmt = (a) => a.map((v) => {
      if (v instanceof Error) return `${v.name}: ${v.message}\n${v.stack || ''}`;
      if (typeof v === 'string') return v;
      try { return JSON.stringify(v); } catch { return String(v); }
    }).join(' ');

    for (const level of ['error', 'warn', 'log', 'info', 'debug']) {
      const orig = console[level].bind(console);
      const bucket = level === 'warn' ? P.warnings : level === 'error' ? P.errors : P[level + 's'] || P.logs;
      console[level] = (...args) => {
        try { bucket.push({ t: Math.round(performance.now()), msg: fmt(args) }); } catch (_) {}
        orig(...args);
      };
    }
    window.addEventListener('error', (e) => {
      P.windowErrors.push({ t: Math.round(performance.now()), message: e.message, source: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack });
    });
    window.addEventListener('unhandledrejection', (e) => {
      P.unhandledRejections.push({ t: Math.round(performance.now()), reason: String((e.reason && e.reason.stack) || e.reason) });
    });

    // ---- boot, mirroring index.html's inline module -------------------------
    (async () => {
      const errEl = document.getElementById('boot-err');
      function fail(msg) {
        if (!errEl) return;
        errEl.hidden = false;
        errEl.textContent = String(msg);
        const st = document.getElementById('boot-status');
        if (st) st.textContent = '起動失敗 / BOOT FAILED';
      }
      window.addEventListener('error', (e) => fail(e.message || e.error));
      window.addEventListener('unhandledrejection', (e) => fail((e.reason && e.reason.stack) || e.reason));
      try {
        P.phase = 'importing-main';
        const mod = await import('../src/main.js');
        P.phase = 'booting';
        if (mod && typeof mod.boot === 'function') await mod.boot();
        P.phase = 'ready';
        P.bootErrVisible = !document.getElementById('boot-err').hidden;
      } catch (err) {
        P.phase = 'failed';
        P.bootFailure = String((err && err.stack) || err);
        fail((err && err.stack) || err);
      }
    })();
  </script>
</body>
</html>
